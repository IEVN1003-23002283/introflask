
{% extends "layout.html" %}

{% block container %}

<h1>Distancia entre dos puntos</h1>

<form action="/distancia" method="post">

    <div class="mb-3">
        <label class="form-label">X1</label>
        <input type="number" step="any" name="x1" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Y1</label>
        <input type="number" step="any" name="y1" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">X2</label>
        <input type="number" step="any" name="x2" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Y2</label>
        <input type="number" step="any" name="y2" class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">
        Calcular
    </button>

</form>

<h3>
    Distancia: {{ "%.2f"|format(resultado) }}
</h3>

{% endblock %}
